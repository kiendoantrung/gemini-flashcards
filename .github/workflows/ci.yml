name: CI

# Quality gate for every pull request, plus direct pushes to main.
# See docs/code-review/process.md §3 for the merge gate this enforces.
#
# `pull_request` is intentionally unfiltered: a stacked PR targets another
# feature branch rather than main, and filtering by base branch left those
# changes ungated until the parent PR merged.

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same branch to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Matches engines.node and the Vercel project runtime.
          node-version: '24'
          # No `cache: npm`: package-lock.json is gitignored, and setup-node
          # cannot resolve a cache key without it.

      - name: Install dependencies
        # `npm ci` requires a committed lockfile, which this repo does not have.
        # Installing from package.json keeps the gate running, but it is not
        # reproducible — committing the lockfile is the proper fix.
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        # Blocking. `vite build` does not typecheck, so before this was enforced
        # the 6 baseline errors shipped to production unnoticed. They are fixed
        # as of this workflow change; keep this blocking so they cannot return.
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
