name: CI

# Quality gate for every change targeting main.
# See docs/code-review/process.md §3 for the merge gate this enforces.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same branch to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        # NON-BLOCKING UNTIL PHASE 0 IS COMPLETE.
        # `vite build` does not typecheck, so 6 pre-existing errors currently ship
        # to production unnoticed. Fix them (docs/code-review/process.md, CR-1)
        # and remove `continue-on-error` in that same PR.
        continue-on-error: true
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
